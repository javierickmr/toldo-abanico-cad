  brackets: null            # TBD
  pivots: null              # TBD
  fasteners: null           # TBD

# -------------------------------------------------------------------
# SAFETY FACTORS
# -------------------------------------------------------------------
# These are ASSUMPTIONS and must be reviewed by engineer

safety_factors:
  static_load: 3.0          # ASSUMPTION - factor of safety for static loads
  dynamic_load: 5.0         # ASSUMPTION - factor for dynamic/impact loads
  fatigue: 2.0              # ASSUMPTION - factor for cyclic loading
  note: "All safety factors are preliminary assumptions"
