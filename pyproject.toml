[project]
name = "awning-cad"
version = "0.1.0"
description = "Parametric CAD design for folding awning structure"
authors = [{name = "Awning CAD Project"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4.0",
    "pytest>=7.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "flake8",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
